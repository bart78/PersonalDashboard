<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONFIG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; letter-spacing: 4px; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 8px; }
  h2 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin: 22px 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row .lbl { width: 74px; font-size: 11px; font-weight: bold; }
  .row input { flex: 1; font-size: 14px; padding: 10px; border: 1px solid #999; font-family: inherit; }
  .row button { font-size: 14px; padding: 8px 12px; background: #000; color: #fff; border: none; }
  .save { font-size: 16px; padding: 14px 20px; background: #000; color: #fff; border: none; letter-spacing: 3px; margin-top: 24px; width: 100%; }
  .status { font-size: 11px; letter-spacing: 2px; color: #666; margin-top: 12px; }
  .toplinks { display: flex; gap: 16px; margin: 12px 0 4px; }
  .toplinks a { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #000; text-decoration: none; border-bottom: 1px solid #000; padding-bottom: 2px; }
  .auth { text-align: center; margin-top: 60px; }
  .auth button { font-size: 16px; padding: 14px 24px; background: #000; color: #fff; border: none; letter-spacing: 2px; }
  .auth .who { font-size: 12px; margin-top: 12px; color: #666; letter-spacing: 1px; }
  #main { display: none; }
</style>
</head>
<body>
  <h1>CONFIG</h1>
  <div class="toplinks">
    <a href="todo.html">TODO LIST</a>
    <a id="newsLink" href="#" target="_blank" rel="noopener">NEWS</a>
  </div>

  <div class="auth" id="auth">
    <button onclick="signIn()">SIGN IN WITH GOOGLE</button>
    <div class="who">Sign in to continue</div>
  </div>

  <div id="main">
    <h2>CARDS</h2>
    <div id="cards"></div>

    <h2>CARD GALLERY</h2>
    <div id="gallery"></div>
    <div class="row"><button onclick="addGal()">+ GALLERY ITEM</button></div>

    <h2>NEWS</h2>
    <div class="row"><input id="news" placeholder="https://…/api/news"></div>

    <button class="save" onclick="save()">SAVE</button>
    <div class="status" id="status"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGOR49t5alnHu0plhyRRud2ibC9_Qeex0",
  authDomain: "crow-c66ca.firebaseapp.com",
  databaseURL: "https://crow-c66ca-default-rtdb.firebaseio.com",
  projectId: "crow-c66ca",
  storageBucket: "crow-c66ca.firebasestorage.app",
  messagingSenderId: "957271416152",
  appId: "1:957271416152:web:5c3618ab93b9a34a9e592d"
};
const ALLOWED_EMAIL = "bart78@gmail.com";
const CARD_NAMES = ["WEATHER", "NAV", "CALENDAR", "NEWS", "STOCKS", "BOOKS", "CARD", "TODO"];

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let cardUrls = ["", "", "", "", "", "", "", ""];
let gallery = {};

function showEditor() {
  document.getElementById("auth").style.display = "none";
  document.getElementById("main").style.display = "block";
  load();
}

function signIn() {
  firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(() => firebase.auth().onAuthStateChanged(checkUser))
    .catch((e) => alert("Sign-in failed: " + e.message));
}

function checkUser(user) {
  if (user && user.email === ALLOWED_EMAIL) {
    showEditor();
  } else if (user) {
    firebase.auth().signOut();
    document.querySelector(".auth .who").textContent = "ACCESS DENIED — not " + ALLOWED_EMAIL;
  }
}

firebase.auth().onAuthStateChanged(checkUser);

async function load() {
  try {
    const snap = await db.ref("config").once("value");
    const c = snap.val() || {};
    cardUrls = [];
    for (let i = 0; i < 8; i++) cardUrls.push((c.card_urls && c.card_urls[String(i)]) || "");
    gallery = c.gallery || {};
    document.getElementById("news").value = c.news_url || "";
    document.getElementById("newsLink").href = c.news_url || "#";
  } catch (e) { /* defaults */ }
  render();
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = "";
  cardUrls.forEach((u, i) => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = '<span class="lbl">' + CARD_NAMES[i] + '</span>';
    const inp = document.createElement("input");
    inp.value = u;
    inp.placeholder = "https://…";
    inp.oninput = () => { cardUrls[i] = inp.value; };
    div.appendChild(inp);
    cards.appendChild(div);
  });
  const gal = document.getElementById("gallery");
  gal.innerHTML = "";
  Object.entries(gallery).forEach(([k, v]) => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = '<span class="lbl">' + k + '</span>';
    const inp = document.createElement("input");
    inp.value = v;
    inp.oninput = () => { gallery[k] = inp.value; };
    const del = document.createElement("button");
    del.textContent = "\u2715";
    del.onclick = () => { delete gallery[k]; render(); };
    div.appendChild(inp);
    div.appendChild(del);
    gal.appendChild(div);
  });
}

function addGal() {
  const keys = Object.keys(gallery).map(Number).filter((n) => !isNaN(n));
  const next = keys.length ? Math.max(...keys) + 1 : 1;
  gallery[String(next)] = "";
  render();
  const inputs = document.getElementById("gallery").querySelectorAll("input");
  if (inputs.length) inputs[inputs.length - 1].focus();
}

async function save() {
  const body = {
    card_urls: Object.fromEntries(cardUrls.map((u, i) => [String(i), u])),
    gallery,
    news_url: document.getElementById("news").value,
  };
  try {
    await db.ref("config").set(body);
    document.getElementById("status").textContent = "SAVED — device picks up on next sync";
    document.getElementById("newsLink").href = document.getElementById("news").value || "#";
  } catch (e) {
    document.getElementById("status").textContent = "SAVE FAILED: " + e.message;
  }
}
</script>
</body>
</html>
