<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 272px; height: 792px; background: #fff; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #000;
    padding: 14px;
    display: flex;
    flex-direction: column;
  }
  .rule { border-top: 1px solid #000; margin: 10px 0; }
  .topline {
    font-size: 8px; letter-spacing: 2px; text-transform: uppercase;
    display: flex; justify-content: space-between;
  }
  .name {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px; font-weight: bold; letter-spacing: -1px;
    margin-top: 14px;
  }
  .title { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .qrwrap { display: flex; justify-content: center; margin-top: 18px; }
  .qrwrap img { width: 200px; height: 200px; image-rendering: pixelated; }
  .contact { margin-top: 14px; font-size: 11px; line-height: 1.9; }
  .contact b { letter-spacing: 1px; }
  .foot {
    margin-top: auto; font-size: 8px; letter-spacing: 2px;
    text-transform: uppercase; display: flex; justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="topline"><span>CONTACT CARD</span><span>N°007</span></div>
  <div class="rule"></div>
  <div class="name">YOURHANDLE@</div>
  <div class="title">PERSONAL · KOREA</div>

  <div class="qrwrap">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=https://t.me/YOURHANDLE" alt="QR">
  </div>

  <div class="contact">
    <b>KAKAO</b>&nbsp;&nbsp;YOURHANDLE<br>
    <b>WHATSAPP</b>&nbsp;&nbsp;+82 10 8516 3845<br>
    <b>TELEGRAM</b>&nbsp;&nbsp;@YOURHANDLE<br>
    <b>EMAIL</b>&nbsp;&nbsp;YOURHANDLE@example.com
  </div>

  <div class="rule"></div>
  <div class="foot"><span>MENU · SYNC</span><span>EDIT CARD 007</span></div>
</body>
</html>
