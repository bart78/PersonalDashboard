<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TODO</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #fff; color: #000;
    max-width: 480px; margin: 0 auto; padding: 20px;
  }
  h1 { font-size: 20px; letter-spacing: 4px; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 8px; }
  .count { font-size: 12px; letter-spacing: 2px; margin: 8px 0 16px; }
  .addrow { display: flex; gap: 8px; margin-bottom: 16px; }
  .addrow input {
    flex: 1; font-size: 16px; padding: 12px; border: 2px solid #000;
    border-radius: 0; font-family: inherit;
  }
  .addrow button {
    font-size: 16px; padding: 12px 18px; background: #000; color: #fff;
    border: none; font-family: inherit; letter-spacing: 2px;
  }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 4px; border-bottom: 1px solid #000;
  }
  .item .box {
    width: 22px; height: 22px; border: 2px solid #000; flex-shrink: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .item.done .box { background: #000; }
  .item .txt { flex: 1; font-size: 17px; line-height: 1.3; }
  .item.done .txt { text-decoration: line-through; opacity: .5; }
  .item .del {
    font-size: 18px; padding: 6px 10px; cursor: pointer; border: none;
    background: none; font-family: inherit; color: #000;
  }
  .status { font-size: 11px; letter-spacing: 2px; color: #666; margin-top: 14px; }
</style>
</head>
<body>
  <h1>TODO</h1>
  <div class="count" id="count"></div>
  <div class="addrow">
    <input id="new" placeholder="Add an item..." autocomplete="off">
    <button onclick="addItem()">ADD</button>
  </div>
  <div id="list"></div>
  <div class="status" id="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGOR49t5alnHu0plhyRRud2ibC9_Qeex0",
  authDomain: "crow-c66ca.firebaseapp.com",
  databaseURL: "https://crow-c66ca-default-rtdb.firebaseio.com",
  projectId: "crow-c66ca",
  storageBucket: "crow-c66ca.firebasestorage.app",
  messagingSenderId: "957271416152",
  appId: "1:957271416152:web:5c3618ab93b9a34a9e592d"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

async function load() {
  try {
    const snap = await db.ref("todo").once("value");
    const data = snap.val();
    const entries = Object.entries(data || {}).filter(([, v]) => v != null);
    const items = entries
      .map(([k, v]) => ({ key: k, text: (v && v.text) || String(v), done: !!(v && v.done) }))
      .sort((a, b) => (a.key < b.key ? -1 : 1));
    render(items);
  } catch (e) {
    document.getElementById("status").textContent = "LOAD FAILED";
  }
}

function render(items) {
  const list = document.getElementById("list");
  list.innerHTML = "";
  const done = items.filter((i) => i.done).length;
  document.getElementById("count").textContent = done + " / " + items.length + " DONE";
  items.forEach((it) => {
    const div = document.createElement("div");
    div.className = "item" + (it.done ? " done" : "");
    const box = document.createElement("span");
    box.className = "box";
    box.onclick = () => toggle(it);
    const txt = document.createElement("span");
    txt.className = "txt";
    txt.textContent = it.text;
    txt.onclick = () => toggle(it);
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "\u2715";
    del.onclick = () => remove(it.key);
    div.appendChild(box);
    div.appendChild(txt);
    div.appendChild(del);
    list.appendChild(div);
  });
  document.getElementById("status").textContent = "SYNCED TO DEVICE";
}

async function toggle(it) {
  await db.ref("todo/" + it.key).update({ done: !it.done });
  load();
}

async function remove(key) {
  await db.ref("todo/" + key).remove();
  load();
}

async function addItem() {
  const input = document.getElementById("new");
  const text = input.value.trim();
  if (!text) return;
  const key = String(Date.now());
  await db.ref("todo/" + key).set({ text, done: false });
  input.value = "";
  load();
}

document.getElementById("new").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addItem();
});
load();
</script>
</body>
</html>
